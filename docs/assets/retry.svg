<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Adaptive retry: new evidence reclassifies the blocker and the decision changes" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#FBBF24"/></marker>
  </defs>
  <rect width="1200" height="300" rx="14" fill="#0B1120" stroke="#243352"/>
  <text x="36" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#6B7B99">ADAPTIVE RETRY · CONTEXT IS REFRESHED, NOT REPLAYED</text>

  <!-- attempt 1 -->
  <g transform="translate(36,66)">
    <rect width="1128" height="60" rx="9" fill="#0E1626" stroke="#243352"/>
    <text x="20" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5D6B85">ATTEMPT 1</text>
    <text x="120" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8899B3">diagnosis</text>
    <text x="216" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#B4C2D9">shipping friction</text>
    <text x="418" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3F4C65">→</text>
    <text x="452" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#E6EDF7" font-weight="600">DELAYED_RETRY</text>
    <text x="700" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#4E5C77">idem key a3f0…9c1</text>
    <g transform="translate(1000,20)"><rect width="108" height="22" rx="6" fill="#261015" stroke="#F87171" stroke-opacity="0.5"/><text x="54" y="15" font-size="11" fill="#FCA5A5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">FAILED</text></g>
  </g>

  <!-- evidence -->
  <g transform="translate(36,138)">
    <path d="M52 0 V22" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a2)"/>
    <text x="88" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#FDE68A">provider reports authorization failure</text>
    <text x="420" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#8A7B48">→ failure taxonomy → reclassified</text>
    <text x="756" y="16" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" fill="#FDE68A" font-weight="600">PAYMENT_METHOD_FAILURE</text>
    <path d="M52 24 V44" stroke="#FBBF24" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#a2)"/>
  </g>

  <!-- attempt 2 -->
  <g transform="translate(36,196)">
    <rect width="1128" height="60" rx="9" fill="#0E1626" stroke="#34D399" stroke-opacity="0.4"/>
    <text x="20" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5D6B85">ATTEMPT 2</text>
    <text x="120" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8899B3">diagnosis</text>
    <text x="216" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#FDE68A">payment friction</text>
    <text x="418" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#3F4C65">→</text>
    <text x="452" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#FFFFFF" font-weight="700">PAYMENT_METHOD_SWITCH</text>
    <text x="700" y="36" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" fill="#4E5C77">idem key 7b21…4e8</text>
    <g transform="translate(1000,20)"><rect width="108" height="22" rx="6" fill="#0F2A20" stroke="#34D399" stroke-opacity="0.55"/><text x="54" y="15" font-size="11" fill="#6EE7B7" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,monospace">CAPTURED</text></g>
  </g>

  <text x="36" y="284" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#5D6B85">two distinct idempotency keys, enforced by a UNIQUE database constraint — not application logic. a test fails if attempt 2 ever reproduces attempt 1 exactly.</text>
</svg>
