<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" width="1200" height="470" role="img" aria-label="Authority matrix: which component is allowed to do what" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <symbol id="yes" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#0F2A20" stroke="#34D399"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#34D399" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="no" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#131C2C" stroke="#2C3A54"/><line x1="8" y1="12" x2="16" y2="12" stroke="#3F4C65" stroke-width="2" stroke-linecap="round"/></symbol>
    <symbol id="never" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#2A1015" stroke="#F87171"/><line x1="8.2" y1="8.2" x2="15.8" y2="15.8" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/><line x1="15.8" y1="8.2" x2="8.2" y2="15.8" stroke="#F87171" stroke-width="2.2" stroke-linecap="round"/></symbol>
  </defs>

  <rect width="1200" height="470" rx="14" fill="#0B1120" stroke="#243352"/>
  <text x="36" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#6B7B99">AUTHORITY MATRIX · WHO IS ALLOWED TO DO WHAT</text>

  <!-- column headers -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="0.8" text-anchor="middle">
    <text x="620" y="82" fill="#6E9AE0">ML</text>
    <text x="720" y="82" fill="#54B894">ECON</text>
    <text x="820" y="82" fill="#B99524">LLM</text>
    <text x="920" y="82" fill="#D08A8A">POLICY</text>
    <text x="1020" y="82" fill="#8899B3">EXEC</text>
    <text x="1120" y="82" fill="#8899B3">HUMAN</text>
  </g>
  <line x1="36" y1="96" x2="1164" y2="96" stroke="#1E2A45"/>

  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13">
    <!-- r1 -->
    <text x="36" y="126" fill="#B4C2D9">Emit a probability</text>
    <use href="#yes" x="609" y="108" width="22" height="22"/><use href="#no" x="709" y="108" width="22" height="22"/><use href="#no" x="809" y="108" width="22" height="22"/><use href="#no" x="909" y="108" width="22" height="22"/><use href="#no" x="1009" y="108" width="22" height="22"/><use href="#no" x="1109" y="108" width="22" height="22"/>
    <!-- r2 -->
    <text x="36" y="164" fill="#B4C2D9">Compute EV / ΔEV</text>
    <use href="#no" x="609" y="146" width="22" height="22"/><use href="#yes" x="709" y="146" width="22" height="22"/><use href="#no" x="809" y="146" width="22" height="22"/><use href="#no" x="909" y="146" width="22" height="22"/><use href="#no" x="1009" y="146" width="22" height="22"/><use href="#no" x="1109" y="146" width="22" height="22"/>
    <!-- r3 -->
    <text x="36" y="202" fill="#B4C2D9">Choose which tool runs next</text>
    <use href="#no" x="609" y="184" width="22" height="22"/><use href="#no" x="709" y="184" width="22" height="22"/><use href="#yes" x="809" y="184" width="22" height="22"/><use href="#no" x="909" y="184" width="22" height="22"/><use href="#no" x="1009" y="184" width="22" height="22"/><use href="#yes" x="1109" y="184" width="22" height="22"/>
    <!-- r4 -->
    <text x="36" y="240" fill="#B4C2D9">Authorize spend</text>
    <use href="#no" x="609" y="222" width="22" height="22"/><use href="#no" x="709" y="222" width="22" height="22"/><use href="#no" x="809" y="222" width="22" height="22"/><use href="#yes" x="909" y="222" width="22" height="22"/><use href="#no" x="1009" y="222" width="22" height="22"/><use href="#yes" x="1109" y="222" width="22" height="22"/>
    <!-- r5 -->
    <text x="36" y="278" fill="#B4C2D9">Create a payment order</text>
    <use href="#no" x="609" y="260" width="22" height="22"/><use href="#no" x="709" y="260" width="22" height="22"/><use href="#no" x="809" y="260" width="22" height="22"/><use href="#no" x="909" y="260" width="22" height="22"/><use href="#yes" x="1009" y="260" width="22" height="22"/><use href="#no" x="1109" y="260" width="22" height="22"/>
  </g>

  <!-- the never block -->
  <rect x="24" y="298" width="1152" height="140" rx="10" fill="#F87171" fill-opacity="0.045"/>
  <rect x="24" y="298" width="3" height="140" rx="1.5" fill="#F87171"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="600">
    <text x="44" y="330" fill="#FCA5A5">Invent a new action</text>
    <use href="#never" x="609" y="312" width="22" height="22"/><use href="#never" x="709" y="312" width="22" height="22"/><use href="#never" x="809" y="312" width="22" height="22"/><use href="#never" x="909" y="312" width="22" height="22"/><use href="#never" x="1009" y="312" width="22" height="22"/><use href="#never" x="1109" y="312" width="22" height="22"/>

    <text x="44" y="364" fill="#FCA5A5">Set a discount amount</text>
    <use href="#never" x="609" y="346" width="22" height="22"/><use href="#never" x="709" y="346" width="22" height="22"/><use href="#never" x="809" y="346" width="22" height="22"/><use href="#never" x="909" y="346" width="22" height="22"/><use href="#never" x="1009" y="346" width="22" height="22"/><use href="#never" x="1109" y="346" width="22" height="22"/>

    <text x="44" y="398" fill="#FCA5A5">Declare recovery</text>
    <use href="#never" x="609" y="380" width="22" height="22"/><use href="#never" x="709" y="380" width="22" height="22"/><use href="#never" x="809" y="380" width="22" height="22"/><use href="#never" x="909" y="380" width="22" height="22"/><use href="#never" x="1009" y="380" width="22" height="22"/><use href="#never" x="1109" y="380" width="22" height="22"/>

    <text x="44" y="428" fill="#FCA5A5">Override the policy gate</text>
    <use href="#never" x="609" y="410" width="22" height="22"/><use href="#never" x="709" y="410" width="22" height="22"/><use href="#never" x="809" y="410" width="22" height="22"/><use href="#never" x="909" y="410" width="22" height="22"/><use href="#never" x="1009" y="410" width="22" height="22"/><use href="#never" x="1109" y="410" width="22" height="22"/>
  </g>

  <text x="44" y="458" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11.5" fill="#8899B3">four rows that no component holds — including the human. this is the safety story.</text>
</svg>
