  <rect x="1" y="46" width="1198" height="17" fill="#101A2E"/>
  <line x1="0" y1="63" x2="1200" y2="63" stroke="#243352"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace">
