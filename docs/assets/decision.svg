<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640" role="img" aria-label="Decision receipt: the highest-converting action has negative incremental value" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="pbar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#334A6E"/><stop offset="100%" stop-color="#4B6491"/>
