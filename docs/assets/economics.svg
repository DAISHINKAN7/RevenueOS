<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="Flat 10 percent converts better than doing nothing and earns less than doing nothing" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bGood" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#0F5F45"/><stop offset="100%" stop-color="#34D399"/></linearGradient>
    <linearGradient id="bBad"  x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#6B2020"/><stop offset="100%" stop-color="#F87171"/></linearGradient>
    <linearGradient id="bNeut" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#25344F"/><stop offset="100%" stop-color="#5A76A8"/></linearGradient>
  </defs>

  <rect width="1200" height="400" rx="14" fill="#0B1120" stroke="#243352"/>

  <text x="36" y="40" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2.4" fill="#6B7B99">HELD-OUT ORACLE EVALUATION · NET CONTRIBUTION PER OPPORTUNITY</text>

  <!-- column heads -->
  <text x="36" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#4E5C77">STRATEGY</text>
  <text x="336" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#4E5C77">CONVERSION</text>
  <text x="500" y="86" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11" letter-spacing="1.4" fill="#4E5C77">NET CONTRIBUTION</text>
  <line x1="36" y1="98" x2="1164" y2="98" stroke="#1E2A45"/>

  <!-- scale ticks: x 500..1140 maps 0..900 -->
  <g stroke="#1A2437">
    <line x1="500" y1="106" x2="500" y2="322"/>
    <line x1="642" y1="106" x2="642" y2="322"/>
    <line x1="784" y1="106" x2="784" y2="322"/>
    <line x1="926" y1="106" x2="926" y2="322"/>
    <line x1="1068" y1="106" x2="1068" y2="322"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" fill="#3F4C65" text-anchor="middle">
    <text x="500" y="340">₹0</text><text x="642" y="340">₹200</text><text x="784" y="340">₹400</text><text x="926" y="340">₹600</text><text x="1068" y="340">₹800</text>
  </g>

  <!-- row 1 DO_NOTHING 732 -> width 732*0.711=520 -->
  <g transform="translate(0,120)">
    <text x="36" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#B4C2D9">DO_NOTHING everywhere</text>
    <text x="336" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8899B3">0.345</text>
    <rect x="500" y="9" width="520" height="20" rx="4" fill="url(#bNeut)"/>
    <text x="1034" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#E6EDF7" font-weight="600">₹732</text>
  </g>

  <!-- row 2 FLAT 10% 559 -> 397 -->
  <g transform="translate(0,168)">
    <rect x="24" y="-4" width="1152" height="46" rx="8" fill="#F87171" fill-opacity="0.05"/>
    <rect x="24" y="-4" width="3" height="46" rx="1.5" fill="#F87171"/>
    <text x="44" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#FFFFFF" font-weight="700">FLAT 10% everywhere</text>
    <text x="336" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#34D399" font-weight="700">0.383 ▲</text>
    <rect x="500" y="9" width="397" height="20" rx="4" fill="url(#bBad)"/>
    <text x="911" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#F87171" font-weight="700">₹559 ▼</text>
  </g>

  <!-- row 3 ORACLE 876 -> 623 -->
  <g transform="translate(0,224)">
    <text x="36" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13.5" fill="#B4C2D9">ORACLE ECONOMIC policy</text>
    <text x="336" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#8899B3">0.460</text>
    <rect x="500" y="9" width="623" height="20" rx="4" fill="url(#bGood)"/>
    <text x="1137" y="24" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" fill="#34D399" font-weight="700">₹876</text>
  </g>

  <!-- dashed reference from do-nothing -->
  <line x1="1020" y1="112" x2="1020" y2="272" stroke="#5A76A8" stroke-dasharray="4 4" stroke-opacity="0.7"/>

  <line x1="36" y1="358" x2="1164" y2="358" stroke="#1E2A45"/>
  <text x="36" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#F87171">Flat 10% converts better than doing nothing — and earns ₹173 less per opportunity than doing nothing.</text>
  <text x="1164" y="382" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#5D6B85" text-anchor="end">wins on conversion in 32.6% · loses on margin in 97.8%</text>
</svg>
