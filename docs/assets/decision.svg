    <text x="232" y="39" font-size="13" fill="#7C8BAA">CHECKOUT_ABANDONMENT</text>
    <text x="470" y="39" font-size="13" fill="#7C8BAA">attempt 1 of 2</text>
    <g transform="translate(950,20)">
