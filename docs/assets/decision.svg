    <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12.5" transform="translate(0,34)">
      <g><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">discount ceiling</text><text x="196" y="12" fill="#5D6B85">₹85 ≤ ₹300</text></g>
      <g transform="translate(340,0)"><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">margin floor</text><text x="196" y="12" fill="#5D6B85">40.3% ≥ 15%</text></g>
      <g transform="translate(680,0)"><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">attempts</text><text x="196" y="12" fill="#5D6B85">1 &lt; 2</text></g>
      <g transform="translate(0,28)"><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">confidence</text><text x="196" y="12" fill="#5D6B85">0.66 ≥ 0.65</text></g>
      <g transform="translate(340,28)"><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">high-value threshold</text><text x="196" y="12" fill="#5D6B85">₹4,869 &lt; ₹10,000</text></g>
      <g transform="translate(680,28)"><path d="M2 7 l4 4 l8 -9" fill="none" stroke="#34D399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="12" fill="#A8B7CE">approval line</text><text x="196" y="12" fill="#5D6B85">₹85 &lt; ₹250</text></g>
    </g>
