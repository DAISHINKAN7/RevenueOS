<!doctype html><html><head><meta charset="utf-8"></head>
<body style="font-family:system-ui;padding:40px;max-width:640px">
<h2>RevenueOS — Razorpay Test Mode</h2>
<p><strong>Step 2 of 2 — make this payment SUCCEED</strong></p>
<p>Order <code>order_TTrUxTdJaiTlXz</code> — ₹4,869.00 (FREE_SHIPPING)</p>
<div style="background:#d4edda;padding:16px;border-radius:8px;margin:20px 0">
<strong>Choose Netbanking, pick any bank, then click SUCCESS.</strong>
</div>
<button onclick="pay()" style="padding:14px 28px;font-size:16px;cursor:pointer">
Open checkout</button>
<p id="s" style="color:#555;margin-top:20px"></p>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script>
function pay(){
  var rzp = new Razorpay({
    key: "rzp_test_TTq8R5pZdR6iSl",
    order_id: "order_TTrUxTdJaiTlXz",
    amount: 486900,
    currency: "INR",
    name: "NovaCart",
    description: "Recovery — FREE_SHIPPING",
    handler: function(r){
      document.getElementById('s').innerHTML =
        "Payment submitted. payment_id <code>"+r.razorpay_payment_id+"</code>";
    },
    modal: { ondismiss: function(){
      document.getElementById('s').innerText =
        "Checkout dismissed — that also produces a failed payment.";
    } }
  });
  rzp.on('payment.failed', function(r){
    document.getElementById('s').innerHTML =
      "Payment failed: <code>"+r.error.code+"</code> — this is what we want for step 1.";
  });
  rzp.open();
}
</script></body></html>
