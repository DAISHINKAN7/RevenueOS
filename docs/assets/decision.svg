      <rect x="452" y="21" width="220" height="9" rx="4.5" fill="#1B2439"/>
      <rect x="452" y="21" width="163" height="9" rx="4.5" fill="url(#pbar)"/>
      <text x="734" y="32" font-size="13" fill="#B4C2D9" text-anchor="end">₹500</text>
      <text x="912" y="32" font-size="15" fill="#F87171" font-weight="700" text-anchor="end">−₹63.40</text>
