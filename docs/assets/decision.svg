      <text x="110" y="14" fill="#94A6C4">idempotency key committed <tspan fill="#FBBF24">before</tspan> any external call → Razorpay Test Mode order → checkout</text>
    </g>
    <g transform="translate(0,24)">
      <text y="14" fill="#5D6B85">VERIFY</text>
      <text x="110" y="14" fill="#94A6C4">webhook <tspan fill="#C9B8FB">payment.captured</tspan> → HMAC-SHA256 over raw bytes → signature valid</text>
    </g>
    <g transform="translate(0,48)">
      <text y="14" fill="#5D6B85">BOOK</text>
      <text x="110" y="14" fill="#94A6C4">RECOVERED · net GMV <tspan fill="#E6EDF7" font-weight="700">₹4,869</tspan> · realized contribution <tspan fill="#34D399" font-weight="700">₹1,963.76</tspan></text>
    </g>
